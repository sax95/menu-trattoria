<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef2ea">
  <title>Menu — Trattoria da Peppe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="wrap">
    <div class="lang" id="lang" role="group" aria-label="Lingua · Language">
      <span class="lang-thumb" aria-hidden="true"></span>
      <button data-lang="it" lang="it" aria-pressed="true" aria-label="Italiano">IT</button>
      <button data-lang="en" lang="en" aria-pressed="false" aria-label="English">EN</button>
    </div>
    <div class="eyebrow reveal" id="tEyebrow" data-fade></div>
    <h1 class="reveal" style="animation-delay: 60ms">Trattoria <em>da Peppe</em></h1>
    <p class="meta reveal" id="tMeta" style="animation-delay: 120ms" data-fade></p>
  </header>

  <!-- Barra fissa: categorie + filtri (riempiti da js/app.js) -->
  <div class="bar">
    <div class="tabs-scroll" id="tabsScroll">
      <div class="tabs-inner" data-fade>
        <nav class="tabs" id="tabs"></nav>
        <div class="tabs tabs-active" id="tabsActive" aria-hidden="true"></div>
      </div>
    </div>
    <div class="filters" id="filters" role="group" data-fade></div>
  </div>

  <main class="wrap" id="menu" data-fade></main>

  <footer class="wrap" id="tFooter" data-fade></footer>

  <!-- Scheda del piatto -->
  <dialog id="dlg" data-state="closed" aria-labelledby="dName">
    <div class="scrim" data-close></div>
    <div class="sheet" id="sheet">
      <span class="handle" aria-hidden="true"></span>
      <div class="hero"><img id="dImg" alt="" decoding="async"></div>
      <div class="sheet-top">
        <div>
          <div class="cat" id="dCat"></div>
          <h3 id="dName"></h3>
          <p class="orig" id="dOrig" lang="it" hidden></p>
        </div>
        <button class="close" id="dClose" data-close>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 2l10 10M12 2L2 12"/></svg>
        </button>
      </div>
      <div class="price" id="dPrice"></div>
      <p class="long" id="dDesc"></p>
      <dl class="info" id="dInfo"></dl>
    </div>
  </dialog>

  <script src="js/menu.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
